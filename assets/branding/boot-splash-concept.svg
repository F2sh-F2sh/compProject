<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#24202e"/><stop offset=".48" stop-color="#15131d"/><stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#efd8ff"/><stop offset=".28" stop-color="#c99aff"/><stop offset=".68" stop-color="#9a65d3"/><stop offset="1" stop-color="#633b8b"/>
    </linearGradient>
    <radialGradient id="portal" cx="50%" cy="44%" r="56%">
      <stop stop-color="#482b69" stop-opacity=".82"/><stop offset=".52" stop-color="#211633" stop-opacity=".74"/><stop offset="1" stop-color="#08080d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="44%" r="69%">
      <stop offset=".52" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".86"/>
    </radialGradient>
    <linearGradient id="echo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9c79ec"/><stop offset=".52" stop-color="#ba74fa"/><stop offset="1" stop-color="#74dfff"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="brick" width="184" height="94" patternUnits="userSpaceOnUse">
      <path d="M0 2h182M0 92h182M1 2v43m91-43v43m91-43v43M-45 47h182M-45 47v43m91-43v43m91-43v43" fill="none" stroke="#72677b" stroke-opacity=".24" stroke-width="3"/>
      <path d="M8 9h65m31 0h54M18 83h49m59 0h40" fill="none" stroke="#a295aa" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
    <clipPath id="screen"><rect width="1600" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <!-- Ancient corridor, with the vanishing point behind the emblem. -->
    <rect width="1600" height="900" fill="#07070c"/>
    <path d="M0 0h1600v900H0z" fill="url(#stone)"/>
    <path d="M0 0h495l170 165v470L0 810z" fill="#17151f"/>
    <path d="M1600 0h-495L935 165v470l665 175z" fill="#17151f"/>
    <path d="M0 0h495l170 165H935L1105 0h495v22h-484l-158 166H637L479 22H0z" fill="#302939" opacity=".62"/>
    <path d="M0 0h495l170 165v470L0 810zM1600 0h-495L935 165v470l665 175z" fill="url(#brick)" opacity=".74"/>
    <path d="M0 810 665 635h270l665 175v90H0z" fill="#0d0c13"/>
    <path d="M0 810 665 635h270l665 175v90H0z" fill="url(#brick)" opacity=".55"/>
    <path d="M665 165h270v470H665z" fill="#0b0a10" stroke="#393044" stroke-width="5"/>
    <path d="M694 192h212v414H694z" fill="#0a0910" stroke="#282333" stroke-width="3"/>
    <path d="M705 606 800 493l95 113" fill="none" stroke="#31273c" stroke-width="4" opacity=".5"/>
    <ellipse cx="800" cy="326" rx="370" ry="300" fill="url(#portal)"/>

    <!-- Integrated geometric hazards, carved into the side walls. -->
    <g fill="none" stroke="#715a8e" stroke-width="5" opacity=".48">
      <path d="M74 271h105v-38l22 38v57H74zm134 0h80m-48-26v79m-32 0h80"/>
      <path d="M1526 271h-105v-38l-22 38v57h127zm-134 0h-80m48-26v79m32 0h-80"/>
      <path d="M82 379h172m-142 0 29-24 28 24 29-24 28 24"/>
      <path d="M1518 379h-172m142 0-29-24-28 24-29-24-28 24"/>
      <circle cx="226" cy="498" r="34"/><circle cx="226" cy="498" r="16"/>
      <circle cx="1374" cy="498" r="34"/><circle cx="1374" cy="498" r="16"/>
    </g>
    <g fill="#9b73c4" opacity=".55">
      <path d="M175 449h18l-9 19zM205 449h18l-9 19zM235 449h18l-9 19zM265 449h18l-9 19z"/>
      <path d="M1425 449h-18l9 19zM1395 449h-18l9 19zM1365 449h-18l9 19zM1335 449h-18l9 19z"/>
    </g>
    <g fill="none" stroke="#9172ab" stroke-width="4" opacity=".48">
      <path d="M100 545h140v18H100zm23-15v48m94-48v48m-94-24h94"/>
      <path d="M1500 545h-140v18h140zm-23-15v48m-94-48v48m94-24h-94"/>
    </g>
    <g fill="#b990ec" opacity=".48">
      <path d="M115 208 126 190l11 18-11 18zM1485 208l-11-18-11 18 11 18z"/>
      <circle cx="314" cy="191" r="4"/><circle cx="1286" cy="191" r="4"/>
      <circle cx="311" cy="574" r="4"/><circle cx="1289" cy="574" r="4"/>
    </g>
    <!-- Spike traps cut into the lower corridor edges. -->
    <g fill="#24202e" stroke="#7e6a91" stroke-width="3" opacity=".72">
      <path d="M42 708h34l18 56H24zm95-22h29l22 67h-73zm116-30h25l28 76h-80z"/>
      <path d="M1558 708h-34l-18 56h70zm-95-22h-29l-22 67h73zm-116-30h-25l-28 76h80z"/>
    </g>

    <!-- Circular time-echo logo and luminous ripple rings. -->
    <circle cx="800" cy="311" r="207" fill="none" stroke="#8a5cb4" stroke-opacity=".34" stroke-width="3"/>
    <circle cx="800" cy="311" r="183" fill="none" stroke="#ab7bea" stroke-opacity=".55" stroke-width="3" stroke-dasharray="105 17 38 20"/>
    <circle cx="800" cy="311" r="157" fill="none" stroke="#8be7ff" stroke-opacity=".38" stroke-width="2" stroke-dasharray="62 16 28 22"/>
    <circle cx="800" cy="311" r="131" fill="none" stroke="#b082f1" stroke-opacity=".38" stroke-width="2"/>
    <circle cx="800" cy="311" r="181" fill="none" stroke="url(#echo)" stroke-width="4" opacity=".58" filter="url(#softGlow)"/>
    <path d="M800 87v31m0 386v26M576 311h28m392 0h28M642 153l20 20m276 276 20 20m0-316-20 20M662 449l-20 20" fill="none" stroke="#bb94f4" stroke-width="4" stroke-linecap="round" opacity=".65"/>
    <g fill="#d5bbff" filter="url(#softGlow)">
      <circle cx="650" cy="202" r="4"/><circle cx="945" cy="216" r="4"/><circle cx="680" cy="438" r="3"/><circle cx="928" cy="419" r="3"/>
      <path d="m633 307 7-7 7 7-7 7zM955 329l6-6 6 6-6 6zM800 112l5-5 5 5-5 5z"/>
    </g>

    <!-- Wizard holding a staff; two offset copies are pale, quiet echoes. -->
    <g fill="none" stroke="#89e6ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".35" transform="translate(-19 10)">
      <path d="M684 247v158m-12-145h24m-24-14 12-20 12 20M748 279c28-20 44-49 47-89l-26-31c33 13 54 2 67-29 13 38 39 54 75 51-28 27-37 59-27 93 6 20 19 37 41 51-37-9-68-7-96 6-32 15-61 19-94 8 22-19 32-37 34-60"/>
      <path d="M771 285c-23 24-36 54-38 91h133c-3-36-18-66-44-91m-87 91-26 37h186l-28-37"/>
    </g>
    <g fill="none" stroke="#9beaff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".48" transform="translate(18 -8)">
      <path d="M684 247v158m-12-145h24m-24-14 12-20 12 20M748 279c28-20 44-49 47-89l-26-31c33 13 54 2 67-29 13 38 39 54 75 51-28 27-37 59-27 93 6 20 19 37 41 51-37-9-68-7-96 6-32 15-61 19-94 8 22-19 32-37 34-60"/>
      <path d="M771 285c-23 24-36 54-38 91h133c-3-36-18-66-44-91m-87 91-26 37h186l-28-37"/>
    </g>
    <g fill="#241b36" stroke="#d0b0f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Staff -->
      <path d="M684 247v158" fill="none" stroke-width="8"/>
      <path d="M672 247h24m-24-14 12-20 12 20" fill="none" stroke-width="5"/>
      <circle cx="684" cy="208" r="9" fill="#9e73e8" stroke="#d8c7ff"/>
      <!-- Bent pointed hat -->
      <path d="M748 279c28-20 44-49 47-89l-26-31c33 13 54 2 67-29 13 38 39 54 75 51-28 27-37 59-27 93 6 20 19 37 41 51-37-9-68-7-96 6-32 15-61 19-94 8 22-19 32-37 34-60Z"/>
      <path d="M758 275c32-13 74-17 119-5m-123 13c43 15 88 13 132-4" fill="none" stroke="#bc9add" stroke-width="4"/>
      <!-- Cloak and shoulders -->
      <path d="M771 285c-23 24-36 54-38 91h133c-3-36-18-66-44-91l-20 18z"/>
      <path d="M733 376h137l27 37H707z"/>
      <path d="M770 301v72m36-72v72m-27-32 9-12 9 12-9 12z" fill="none" stroke="#91dff4" stroke-width="4"/>
    </g>
    <path d="M804 178v14" stroke="#9bf1ff" stroke-width="4" opacity=".9"/>

    <!-- Compact title lockup -->
    <path d="M510 493h190l18-7h164l18 7h190" fill="none" stroke="#9876b5" stroke-width="2" opacity=".72"/>
    <path d="m790 484 10-10 10 10-10 10z" fill="#c7a6ec"/>
    <text x="800" y="548" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="31" font-weight="600" letter-spacing="12" fill="#d9c9e8" opacity=".92">THE SEALED</text>
    <text x="800" y="653" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, serif" font-size="100" font-weight="700" letter-spacing="7" fill="url(#title)" stroke="#251632" stroke-width="4" paint-order="stroke" filter="url(#titleGlow)">BELFRY</text>
    <path d="M604 683h145m102 0h145" fill="none" stroke="#77618e" stroke-width="2"/>
    <path d="M785 683h30l-15 12z" fill="#a878d7" opacity=".82"/>
    <text x="800" y="836" text-anchor="middle" font-family="'Arial', sans-serif" font-size="18" letter-spacing="6" fill="#bcb7c3" opacity=".78">COMPPROJECT TEAM PRESENTS</text>

    <!-- Edge darkness preserves the startup-screen focus. -->
    <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
  </g>
</svg>
